name: CI

on:
  push:
    branches: [main, master, sentinel-2]
  pull_request:
    branches: [main, master, sentinel-2]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff build
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src/sentinel2
      - name: Tests
        run: python -m pytest -q -m "not perf"
      - name: Wheel smoke
        run: |
          python -m build
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', glob.glob('dist/*.whl')[0]])"
          project-sentinel --version
          project-sentinel scan benchmarks/fixtures/python_app --format json --out smoke.json
          python -c "import json; data=json.load(open('smoke.json', encoding='utf-8')); assert data['schema_version'] == 2"

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Performance budgets
        run: python -m pytest -q -m perf
      - name: Synthetic 10k benchmark
        run: |
          python tools/gen_repo.py --files 10000 --out .tmp/repo-10k --force
          python tools/benchmark.py --repo .tmp/repo-10k --mode all --json
