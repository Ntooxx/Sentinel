name: Sentinel Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Sentinel
        run: python -m pip install .
      - name: Build quality report
        run: project-sentinel scan . --format md --out sentinel-report.md
      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-quality-report
          path: sentinel-report.md
