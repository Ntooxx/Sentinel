# Netlify config when the site is deployed from this repository.
#
# The landing page is web/index.html and it ships the Pyodide in-browser runner,
# which downloads pkg/bundle.json from the same directory. This build assembles
# public/ with both files, so "Run Sentinel on your own code" works with no
# server and no install.
#
# A drag-and-drop deploy instead uploads the public/ folder produced by:
#   python tools/build_netlify_site.py

[build]
  command = "python tools/build_netlify_site.py --out-dir public"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/pkg/bundle.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"